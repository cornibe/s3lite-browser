<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S3 Browser-lite</title>
    <!-- Early dark-mode bootstrapping to avoid white flash -->
    <script>
      try {
        var raw = localStorage.getItem('s3-browser-lite.settings') || localStorage.getItem('s3lite.settings')
        if (raw) {
          var s = JSON.parse(raw)
          if (s && s.darkMode) {
            document.documentElement.classList.add('dark')
          }
          // Migrate legacy key to new key for future loads
          try { localStorage.setItem('s3-browser-lite.settings', raw) } catch (e) {}
        }
      } catch (e) { /* ignore */ }
    </script>
    <!-- Minimal inline splash styles (no dependency on app CSS) -->
    <style>
      #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 9999;
        background: #ffffff; color: #111827; opacity: 1; visibility: visible; transition: opacity 200ms ease, visibility 0s linear 0s; }
      html.dark #splash { background: #1e1e1e; color: #cccccc; }
      #splash.hide { opacity: 0; visibility: hidden; transition: opacity 200ms ease, visibility 0s linear 200ms; }
      #splash .box { display: flex; gap: 12px; align-items: center; font: 500 14px/1.2 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
      #splash .spinner { width: 16px; height: 16px; border-radius: 9999px; border: 2px solid currentColor; border-right-color: transparent; animation: spn 0.8s linear infinite; opacity: 0.85; }
      @keyframes spn { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #splash .spinner { animation: none; border-right-color: currentColor; } }
    </style>
  </head>
  <body class="min-h-screen bg-white text-neutral-900 dark:bg-[#1e1e1e] dark:text-[#cccccc]">
    <!-- Splash overlay shown until React mounts -->
    <div id="splash" role="status" aria-live="polite" aria-label="Loading">
      <div class="box">
        <div class="spinner" aria-hidden="true"></div>
        <div class="label">Loading…</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
