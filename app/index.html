<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S3 Browser</title>
    <!-- Early dark-mode bootstrapping to avoid white flash -->
    <script>
      try {
        var raw = localStorage.getItem('s3lite.settings')
        if (raw) {
          var s = JSON.parse(raw)
          if (s && s.darkMode) {
            document.documentElement.classList.add('dark')
          }
        }
      } catch (e) { /* ignore */ }
    </script>
  </head>
  <body class="min-h-screen bg-white text-neutral-900 dark:bg-[#1e1e1e] dark:text-[#cccccc]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
