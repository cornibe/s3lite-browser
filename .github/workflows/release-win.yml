name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    env:
      # electron-builder uses GH_TOKEN; GitHub Actions exposes GITHUB_TOKEN
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set cache env vars
        shell: pwsh
        run: |
          $cacheRoot = $env:RUNNER_TEMP
          "ELECTRON_CACHE=$cacheRoot\electron" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ELECTRON_BUILDER_CACHE=$cacheRoot\electron-builder" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Derive version from tag
        if: startsWith(github.ref_name, 'v')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Write-Host "Setting app version to $version"
          $pkgPath = Join-Path $pwd 'package.json'
          $pkg = Get-Content $pkgPath | ConvertFrom-Json
          $pkg.version = $version
          $pkg | ConvertTo-Json -Depth 20 | Out-File -FilePath $pkgPath -Encoding utf8

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }

      - name: Build app (renderer + electron)
        run: npm run build

      - name: Package Windows (NSIS + MSI)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis msi --publish always

      - name: List dist output
        shell: pwsh
        run: Get-ChildItem -Recurse dist | Select-Object FullName, Length

      - name: Upload installers to Actions artifacts (optional)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: s3-browser-windows-${{ github.ref_name }}
          path: |
            app/dist/*.exe
            app/dist/*.msi
            app/dist/latest.yml
          if-no-files-found: warn
