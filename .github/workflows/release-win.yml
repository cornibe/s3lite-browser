name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (for example: v0.2.3)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-win-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $tag = '${{ github.event.inputs.tag }}'
          }
          else {
            $tag = $env:GITHUB_REF_NAME
          }

          if (-not $tag.StartsWith('v')) {
            throw "Release tag must start with 'v'. Received: $tag"
          }

          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Release tag must follow semver (vMAJOR.MINOR.PATCH[-PRERELEASE]). Received: $tag"
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup Node.js 20 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set cache env vars
        shell: pwsh
        run: |
          $cacheRoot = $env:RUNNER_TEMP
          "ELECTRON_CACHE=$cacheRoot\electron" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ELECTRON_BUILDER_CACHE=$cacheRoot\electron-builder" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}\electron
            ${{ runner.temp }}\electron-builder
          key: windows-electron-${{ hashFiles('app/package-lock.json') }}
          restore-keys: |
            windows-electron-

      - name: Derive version from tag
        shell: pwsh
        run: |
          $version = '${{ steps.release_tag.outputs.tag }}'.TrimStart('v')
          Write-Host "Setting app version to $version"
          $pkgPath = Join-Path $pwd 'package.json'
          $pkg = Get-Content $pkgPath | ConvertFrom-Json
          $pkg.version = $version
          $pkg | ConvertTo-Json -Depth 20 | Out-File -FilePath $pkgPath -Encoding utf8

      - name: Install dependencies
        run: npm ci

      - name: Install WiX Toolset (MSI)
        run: choco install wixtoolset -y --no-progress

      - name: Install NSIS (EXE)
        run: choco install nsis -y --no-progress

      - name: Build app (renderer + electron)
        run: npm run build

      - name: Package Windows (NSIS + MSI) and publish to GitHub
        run: npx electron-builder --win nsis msi --publish always

      - name: Create stable Windows installer aliases
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter *.exe | Sort-Object Name | Select-Object -First 1
          if (-not $exe) {
            throw 'No Windows EXE installer found in dist.'
          }

          $msi = Get-ChildItem dist -Filter *.msi | Sort-Object Name | Select-Object -First 1
          if (-not $msi) {
            throw 'No Windows MSI installer found in dist.'
          }

          Copy-Item $exe.FullName (Join-Path $pwd 'dist\s3-browser-lite-windows-latest.exe') -Force
          Copy-Item $msi.FullName (Join-Path $pwd 'dist\s3-browser-lite-windows-latest.msi') -Force

      - name: Upload stable Windows installer aliases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            app/dist/s3-browser-lite-windows-latest.exe
            app/dist/s3-browser-lite-windows-latest.msi
          overwrite_files: true

      - name: List dist output
        shell: pwsh
        run: Get-ChildItem -Recurse dist | Select-Object FullName, Length

      - name: Upload installers to Actions artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: s3lite-browser-windows-${{ steps.release_tag.outputs.tag }}
          path: |
            app/dist/*.exe
            app/dist/*.msi
            app/dist/latest.yml
            app/dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
  # Optional: add build provenance attestation once your org/repo supports it
  # - name: Attest build provenance
  #   uses: actions/attest-build-provenance@v1
  #   with:
  #     subject-path: app/dist/*
