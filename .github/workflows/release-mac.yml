name: Release macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (for example: v0.2.3)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-mac-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag='${{ github.event.inputs.tag }}'
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set cache env vars
        run: |
          cacheRoot="$RUNNER_TEMP"
          echo "ELECTRON_CACHE=$cacheRoot/electron" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_CACHE=$cacheRoot/electron-builder" >> "$GITHUB_ENV"

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/electron
            ${{ runner.temp }}/electron-builder
          key: macos-electron-${{ hashFiles('app/package-lock.json') }}
          restore-keys: |
            macos-electron-

      - name: Derive version from tag
        run: |
          version="${{ steps.release_tag.outputs.tag }}"
          version="${version#v}"
          echo "Setting app version to $version"
          node -e "const fs=require('fs');const path='package.json';const pkg=JSON.parse(fs.readFileSync(path,'utf8'));pkg.version='${version}';fs.writeFileSync(path,JSON.stringify(pkg,null,2));"

      - name: Install dependencies
        run: npm ci

      - name: Generate icons (PNG + ICO)
        run: |
          node scripts/write-icon.js

      - name: Convert PNG to ICNS
        run: |
          set -euo pipefail
          base=icons/icon.png
          if [ ! -f "$base" ]; then
            echo "Missing $base" >&2
            exit 1
          fi
          iconset=icons/tmp.iconset
          rm -rf "$iconset"
          mkdir -p "$iconset"
          for size in 16 32 64 128 256 512 1024; do
            sips -z $size $size "$base" --out "$iconset/icon_${size}x${size}.png" >/dev/null
            if [ $size -ne 16 ]; then
              double=$((size*2))
              sips -z $double $double "$base" --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null || true
            fi
          done
          iconutil -c icns "$iconset" -o icons/icon.icns
          ls -lh icons

      - name: Build app (renderer + electron)
        run: npm run build

      - name: Package macOS (unsigned dmg)
        run: npx electron-builder --mac dmg --publish always

      - name: List dist output
        run: ls -l dist

      - name: Upload artifacts to Actions
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: s3-browser-macos-${{ steps.release_tag.outputs.tag }}
          path: |
            app/dist/*.dmg
            app/dist/*.zip
            app/dist/*.blockmap
            app/dist/latest-mac.yml
          if-no-files-found: warn