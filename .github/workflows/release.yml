name: Release on push to main

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build and Release (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Ensure electron-builder doesn't try to auto-detect signing
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Install WiX Toolset (for MSI)
        run: choco install wixtoolset -y

      - name: Install NSIS (for .exe/NSIS)
        run: choco install nsis -y

      - name: Build Windows installers (.exe and .msi)
        working-directory: app
        run: npm run build:win

      - name: Read package version
        id: pkg
        shell: pwsh
        working-directory: app
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          echo "version=$($pkg.version)" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release and upload installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}-build.${{ github.run_number }}
          name: S3 Browser-lite v${{ steps.pkg.outputs.version }} (build ${{ github.run_number }})
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/dist/*.exe
            app/dist/*.msi
            app/dist/latest.yml
            app/dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    concurrency:
      group: release-main-${{ github.ref }}
      cancel-in-progress: false
